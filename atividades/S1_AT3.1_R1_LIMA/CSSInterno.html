<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Página com estilo CSS inline">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>CSS Interno</title>
    <style>
        body {
            background-color: rgb(254, 205, 164);
            font-size: 48px;
            font-family: Arial, Helvetica, sans-serif;
        }
        h1 {
            color: rgb(90, 58, 58);
            font-family: 'Times New Roman', Times, serif;
        }
        p {
            color: rgb;
        }
    </style>
</head>

<body>
    <h1>CSS Interno</h1>
    <h1 style="color: brown;">Este é um título com estilo inline</h1>
    <div>
        <p>Este é um exemplo com estilo CSS interno.</p>
    </div>

</body>
</html>
